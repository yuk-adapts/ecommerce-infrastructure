server.port=8080

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Global CORS for Angular frontend
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:4200
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origin-patterns=http://localhost:4200,http://127.0.0.1:4200
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true

# Circuit Breaker default configuration
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.slow-call-rate-threshold=50
resilience4j.circuitbreaker.configs.default.slow-call-duration-threshold=30s

# Circuit Breaker instances - MUST link to default config
resilience4j.circuitbreaker.instances.orderServiceCircuitBreaker.base-config=default
resilience4j.circuitbreaker.instances.inventoryServiceCircuitBreaker.base-config=default
resilience4j.circuitbreaker.instances.paymentServiceCircuitBreaker.base-config=default
resilience4j.circuitbreaker.instances.cartServiceCircuitBreaker.base-config=default
resilience4j.circuitbreaker.instances.authServiceCircuitBreaker.base-config=default

# TimeLimiter default configuration - CRITICAL: This is what the circuit breaker filter uses for timeout
resilience4j.timelimiter.configs.default.timeout-duration=60s
resilience4j.timelimiter.configs.default.cancel-running-future=true

# TimeLimiter instances - MUST link to default config and can override timeout
resilience4j.timelimiter.instances.orderServiceCircuitBreaker.base-config=default
resilience4j.timelimiter.instances.orderServiceCircuitBreaker.timeout-duration=60s
resilience4j.timelimiter.instances.inventoryServiceCircuitBreaker.base-config=default
resilience4j.timelimiter.instances.inventoryServiceCircuitBreaker.timeout-duration=30s
resilience4j.timelimiter.instances.paymentServiceCircuitBreaker.base-config=default
resilience4j.timelimiter.instances.paymentServiceCircuitBreaker.timeout-duration=30s
resilience4j.timelimiter.instances.cartServiceCircuitBreaker.base-config=default
resilience4j.timelimiter.instances.cartServiceCircuitBreaker.timeout-duration=30s
resilience4j.timelimiter.instances.authServiceCircuitBreaker.base-config=default
resilience4j.timelimiter.instances.authServiceCircuitBreaker.timeout-duration=30s

spring.cloud.gateway.httpclient.connect-timeout=10000
spring.cloud.gateway.httpclient.response-timeout=60s

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}

management.endpoints.web.exposure.include=health,info,prometheus,gateway
management.endpoint.health.show-details=always
management.endpoint.gateway.enabled=true

logging.level.root=INFO
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.com.vv456.api_gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG