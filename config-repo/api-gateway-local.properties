eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.data.redis.host=localhost
spring.data.redis.port=6380
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

logging.level.com.vv456.api_gateway=DEBUG
logging.level.reactor.netty=DEBUG

# TimeLimiter configuration for local development
# Override default timeout for circuit breaker filters
resilience4j.timelimiter.configs.default.timeout-duration=60s
resilience4j.timelimiter.instances.orderServiceCircuitBreaker.timeout-duration=60s
resilience4j.timelimiter.instances.inventoryServiceCircuitBreaker.timeout-duration=30s
resilience4j.timelimiter.instances.paymentServiceCircuitBreaker.timeout-duration=30s
resilience4j.timelimiter.instances.cartServiceCircuitBreaker.timeout-duration=30s
